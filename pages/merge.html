  <meta property="og:url" content="https://nextgen-pdf.web.app/pages/merge.html" />

  <meta property="og:description" content="Combine multiple PDF files into one document quickly and easily." />
  <meta property="og:image" content="https://nextgen-pdf.web.app/Assests/Logo.png" />

  <link rel="stylesheet" href="../css/style.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://nextgen-pdf.web.app/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Tools",
            "item": "https://nextgen-pdf.web.app/pages/tools.html"
          },
          {

            "position": 3,
            "name": "Merge PDF",
            "item": "https://nextgen-pdf.web.app/pages/merge.html"
          }
        ]
      },
      {
        "@type": "SoftwareApplication",
        "name": "NextGen PDF Merger",
        "operatingSystem": "All",
        "applicationCategory": "BusinessApplication"
      }
    ]
  }
  </script>
</head>
<body data-tool="merge">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../index.html" class="brand-logo">
        <img src="../Assests/Logo-icon.png" alt="NextGen PDF Logo" width="36" height="36" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>

      <nav class="nav-links nav-links-desktop">
        <a href="../index.html">Home</a>
        <a href="tools.html">All Tools</a>
        <a href="pricing.html">Pricing</a>
        <a href="faq.html">FAQ</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
        <a href="auth/login.html" class="btn btn-ghost btn-sm">Log in</a>
        <a href="auth/register.html" class="btn btn-primary btn-sm">Get Started</a>
      </div>
    </div>
  </header>

  <!-- Breadcrumbs Bar -->
  <div style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 0; font-size: 13px; color: var(--text-muted);">
    <div class="container" style="display: flex; gap: 8px; align-items: center;">
      <a href="../index.html">Home</a> <span>›</span>
      <a href="tools.html">Tools</a> <span>›</span>
      <span style="color: var(--text-primary); font-weight: 700;">Merge PDF</span>
    </div>
  </div>

  <!-- Hero & Upload -->
  <section style="padding: 50px 0 30px;">
    <div class="container" style="max-width: 800px; text-align: center;">
      <span class="hero-eyebrow">📄 PDF MERGER TOOL</span>
      <h1 style="margin-top: 12px;">Merge PDF Files Online</h1>
      <p style="font-size: var(--text-body-lg); color: var(--text-muted); margin-top: 12px;">
        Combine multiple PDF files into one single organized document in seconds.
      </p>

      <div id="merge-uploader-container" style="margin-top: 32px; text-align: left;"></div>
    </div>
  </section>

  <!-- Related Tools Topic Cluster -->
  <section style="padding: 40px 0; border-top: 1px solid var(--border);">
    <div class="container" style="text-align: center;">
      <h3 style="margin-bottom: 16px;">Related PDF Tools</h3>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">

        <a href="jpg-to-pdf.html" class="chip">🖼️ JPG to PDF</a>
      </div>
    </div>
  </section>

  <script src="../js/components.js"></script>
  <script src="../js/uploader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.activeUploader = new PDFUploader('merge-uploader-container', {
        multiple: true,
        onFilesSelected: (files) => {
          Toast.show({ message: `Loaded ${files.length} PDFs to merge`, type: 'success' });
          window.activeUploader.simulateProgress();
        }
      });
    });
  </script>
</body>
