<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Files — Dashboard — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>

  <!-- Top Navbar -->
  <header class="site-header">
    <div class="container nav-bar" style="width: 100%; max-width: 100%; padding: 0 24px;">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar-nav">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 0 12px 8px 12px;">User Account</div>
      <a href="index.html" class="sidebar-item">📊 Overview</a>
      <a href="files.html" class="sidebar-item active">📁 Files</a>
      <a href="history.html" class="sidebar-item">📜 History</a>
      <a href="usage.html" class="sidebar-item">📈 Usage</a>
      <a href="ai-usage.html" class="sidebar-item">🤖 AI Usage</a>
      <a href="subscription.html" class="sidebar-item">⭐ Subscription</a>
      <a href="billing.html" class="sidebar-item">💳 Billing</a>
      <a href="profile.html" class="sidebar-item">👤 Profile</a>
      <a href="security.html" class="sidebar-item">🔒 Security</a>
    </aside>

    <main class="dashboard-content">
      <h2>My Saved Files</h2>
      <p style="margin-top: 4px; margin-bottom: 24px;">Manage and download your processed PDF documents.</p>

      <div class="card">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted);">
              <th style="padding: 12px;">File Name</th>
              <th style="padding: 12px;">Size</th>
              <th style="padding: 12px;">Saved Date</th>
              <th style="padding: 12px; text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom: 1px solid var(--border);">
              <td style="padding: 12px; font-weight: 700;">📄 document-compressed.pdf</td>
              <td style="padding: 12px;">2.4 MB</td>
              <td style="padding: 12px;">Sep 22, 2026</td>
              <td style="padding: 12px; text-align: right;">
                <button class="btn btn-outline btn-sm">Download</button>
                <button class="btn btn-ghost btn-sm" onclick="Toast.show({ message: 'File deleted', type: 'info' })">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../../js/components.js"></script>
</body>
</html>
