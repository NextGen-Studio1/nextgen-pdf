<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organization Settings — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar" style="width: 100%; max-width: 100%; padding: 0 24px;">
      <a href="../../../index.html" class="brand-logo">
        <img src="../../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar-nav">
      <a href="index.html" class="sidebar-item">🏢 Overview</a>
      <a href="team.html" class="sidebar-item">👥 Team Members</a>
      <a href="api.html" class="sidebar-item">🔑 API Keys</a>
      <a href="billing.html" class="sidebar-item">💳 Enterprise Billing</a>
      <a href="settings.html" class="sidebar-item active">⚙️ Org Settings</a>
    </aside>

    <main class="dashboard-content">
      <h2>Organization Profile</h2>
      <p style="margin-top: 4px; margin-bottom: 24px;">Configure company name, SSO, and data retention rules.</p>

      <div class="card" style="max-width: 560px;">
        <form onsubmit="event.preventDefault(); Toast.show({ message: 'Settings saved', type: 'success' });">
          <div class="form-group">
            <label class="form-label" for="org-name">Company Name</label>
            <input type="text" id="org-name" class="input-text" value="Acme Corp" />
          </div>

          <div class="form-group">
            <label class="form-label" for="retention">Data Retention Period</label>
            <select id="retention" class="input-select">
              <option value="1h">1 Hour (Default)</option>
              <option value="24h">24 Hours</option>
              <option value="7d">7 Days</option>
              <option value="custom">Never store on server</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Save Settings</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../../../js/components.js"></script>
</body>
</html>
