<main class="dashboard-content">
<h2>Profile Settings</h2>
<p style="margin-top: 4px; margin-bottom: 24px;">Update your personal info and preferences.</p>
<div class="card" style="max-width: 560px;">
<form id="profile-form">
<div class="form-group">
<label class="form-label" for="prof-name">Full Name</label>
<input class="input-text" id="prof-name" required="" type="text"/>
</div>
<div class="form-group">
<label class="form-label" for="prof-email">Email Address</label>
<input class="input-text" disabled="" id="prof-email" type="email"/>
<small style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Primary account email cannot be edited directly.</small>
</div>
<button class="btn btn-primary" id="save-profile-btn" style="margin-top: 12px;" type="submit">Save Changes</button>
</form>
</div>
</main>
</div>
<script src="../../js/config.js"></script>
<script src="../../js/firebase-config.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script>
    NextGenAuth.requireAuth().then(async (user) => {
      const nameInput = document.getElementById('prof-name');
      const emailInput = document.getElementById('prof-email');
      
      emailInput.value = user.email || '';
      const profile = await NextGenAuth.getUserProfile(user.uid);
      nameInput.value = user.displayName || profile?.name || '';
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-profile-btn');
      const newName = document.getElementById('prof-name').value.trim();

      try {
        btn.disabled = true;
        btn.textContent = 'Saving...';
        const user = NextGenAuth.getCurrentUser();
        const { updateProfile } = await NextGenAuth.waitForFirebase();
        
        if (user && newName) {
          await updateProfile(user, { displayName: newName });
          await NextGenAuth.syncUserProfile(user, { fullName: newName });
          NextGenAuth.updateDashboardUI(user);
          Toast.show({ message: 'Profile updated successfully!', type: 'success' });
        }
      } catch (err) {
        console.error('Profile update error:', err);
        Toast.show({ message: err.message || 'Failed to update profile.', type: 'error' });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    });
  </script>
