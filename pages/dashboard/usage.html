<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usage Analytics — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar" style="width: 100%; max-width: 100%; padding: 0 24px;">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar-nav">
      <a href="index.html" class="sidebar-item">📊 Overview</a>
      <a href="files.html" class="sidebar-item">📁 Files</a>
      <a href="history.html" class="sidebar-item">📜 History</a>
      <a href="usage.html" class="sidebar-item active">📈 Usage</a>
      <a href="ai-usage.html" class="sidebar-item">🤖 AI Usage</a>
      <a href="subscription.html" class="sidebar-item">⭐ Subscription</a>
      <a href="billing.html" class="sidebar-item">💳 Billing</a>
      <a href="profile.html" class="sidebar-item">👤 Profile</a>
      <a href="security.html" class="sidebar-item">🔒 Security</a>
    </aside>

    <main class="dashboard-content">
      <h2>Usage Analytics</h2>
      <p style="margin-top: 4px; margin-bottom: 24px;">Daily and monthly operation metrics.</p>

      <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px;">
        <div class="stats-card">
          <div class="stats-card-lbl">Total Tasks (This Month)</div>
          <div class="stats-card-val">64</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-lbl">Data Processed</div>
          <div class="stats-card-val">340 MB</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-lbl">Avg Response Time</div>
          <div class="stats-card-val">1.2s</div>
        </div>
      </div>

      <div class="card">
        <h3>Daily Operations (September)</h3>
        <div style="height: 160px; background: var(--primary-bg); border-radius: var(--radius-lg); margin-top: 16px; display: flex; align-items: flex-end; padding: 20px; gap: 12px;">
          <div style="height: 30%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 55%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 85%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 40%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 70%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 90%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
          <div style="height: 65%; flex: 1; background: var(--primary); border-radius: 4px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/components.js"></script>
</body>
</html>
