<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Settings — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar" style="width: 100%; max-width: 100%; padding: 0 24px;">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar-nav">
      <a href="index.html" class="sidebar-item">📊 Overview</a>
      <a href="files.html" class="sidebar-item">📁 Files</a>
      <a href="history.html" class="sidebar-item">📜 History</a>
      <a href="usage.html" class="sidebar-item">📈 Usage</a>
      <a href="ai-usage.html" class="sidebar-item">🤖 AI Usage</a>
      <a href="subscription.html" class="sidebar-item">⭐ Subscription</a>
      <a href="billing.html" class="sidebar-item">💳 Billing</a>
      <a href="profile.html" class="sidebar-item">👤 Profile</a>
      <a href="security.html" class="sidebar-item active">🔒 Security</a>
    </aside>

    <main class="dashboard-content">
      <h2>Account Security</h2>
      <p style="margin-top: 4px; margin-bottom: 24px;">Update password, 2FA, and active sessions.</p>

      <div class="card" style="max-width: 560px; margin-bottom: 24px;">
        <h3 style="margin-bottom: 16px;">Change Password</h3>
        <form onsubmit="event.preventDefault(); Toast.show({ message: 'Password updated!', type: 'success' });">
          <div class="form-group">
            <label class="form-label" for="curr-pass">Current Password</label>
            <input type="password" id="curr-pass" class="input-text" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="new-pass">New Password</label>
            <input type="password" id="new-pass" class="input-text" required />
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Update Password</button>
        </form>
      </div>

      <div class="card" style="max-width: 560px;">
        <h3>Two-Factor Authentication (2FA)</h3>
        <p style="margin: 8px 0 16px 0;">Add an extra layer of security to your account.</p>
        <button class="btn btn-secondary btn-sm" onclick="Toast.show({ message: '2FA Setup dialog ready', type: 'info' })">Enable 2FA</button>
      </div>
    </main>
  </div>

  <script src="../../js/components.js"></script>
</body>
</html>
