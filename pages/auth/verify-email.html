<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
    <div class="card" style="width: min(440px, 100%); padding: 36px; text-align: center;">
      <div style="font-size: 48px; margin-bottom: 16px;">✉️</div>
      <h2>Verify your email</h2>
      <p style="margin: 12px 0 24px 0;">We sent a verification link to your email address. Please click the link to activate your account.</p>

      <a href="../dashboard/index.html" class="btn btn-primary btn-lg" style="width: 100%;">Continue to Dashboard</a>

      <div style="margin-top: 24px; font-size: 13px; color: var(--text-muted);">
        Didn't receive the email? <button class="btn btn-ghost btn-sm" onclick="Toast.show({ message: 'Verification link resent!', type: 'info' })">Resend link</button>
      </div>
    </div>
  </main>

  <script src="../../js/components.js"></script>
</body>
</html>
