<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — NextGen PDF</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF Logo" width="36" height="36" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Register Form Container -->
  <main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
    <div class="card" style="width: min(440px, 100%); padding: 36px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <h2>Create your account</h2>
        <p style="margin-top: 6px;">Start processing PDFs in seconds for free</p>
      </div>

      <form id="register-form" onsubmit="event.preventDefault(); window.location.href='verify-email.html';">
        <div class="form-group">
          <label class="form-label" for="fullname">Full name</label>
          <input type="text" id="fullname" class="input-text" placeholder="Ankush Sharma" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="input-text" placeholder="name@company.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input-text" placeholder="At least 8 characters" required />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" required /> I agree to the <a href="../privacy.html" style="color: var(--primary);">Terms of Service</a> and Privacy Policy
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">Create Free Account</button>
      </form>

      <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-muted); font-size: 13px;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span>OR</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <button type="button" class="btn btn-secondary btn-lg" style="width: 100%; justify-content: center;" onclick="Toast.show({ message: 'Google Auth Ready', type: 'info' })">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px; height: 18px;" />
        Sign up with Google
      </button>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log in</a>
      </div>
    </div>
  </main>

  <script src="../../js/components.js"></script>
</body>
</html>
