<!DOCTYPE html>

<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password — NextGen PDF</title>
<link href="../../Assests/Logo-icon.png" rel="icon" type="image/png"/>
<link href="../../css/style.css" rel="stylesheet"/>
<meta content="NextGen PDF online document and PDF tools." name="description"/><meta content="noindex, nofollow" name="robots"/><link href="https://nextgen-pdf.web.app/pages/auth/reset-password" rel="canonical"/><meta content="Reset Password — NextGen PDF" property="og:title"/><meta content="NextGen PDF online document and PDF tools." property="og:description"/><meta content="https://nextgen-pdf.web.app/pages/auth/reset-password" property="og:url"/><meta content="website" property="og:type"/><meta content="NextGen PDF" property="og:site_name"/><meta content="https://nextgen-pdf.web.app/Assests/Logo-clean.png" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Reset Password — NextGen PDF" name="twitter:title"/><meta content="NextGen PDF online document and PDF tools." name="twitter:description"/><meta content="https://nextgen-pdf.web.app/Assests/Logo-clean.png" name="twitter:image"/></head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
<!-- Header -->
<header class="site-header">
<div class="container nav-bar">
<a class="brand-logo" href="../../index.html">
<img alt="NextGen PDF" src="../../Assests/Logo-icon.png"/>
<span>NextGen <b class="text-gradient">PDF</b></span>
</a>
</div>
</header>
<main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
<div class="card" style="width: min(440px, 100%); padding: 36px;">
<div style="text-align: center; margin-bottom: 28px;">
<h2>Set new password</h2>
<p style="margin-top: 6px;">Please choose a secure new password</p>
</div>
<form id="reset-form">
<div class="form-group">
<label class="form-label" for="new-pass">New password</label>
<input class="input-text" id="new-pass" minlength="6" placeholder="At least 6 characters" required="" type="password"/>
</div>
<div class="form-group">
<label class="form-label" for="confirm-pass">Confirm new password</label>
<input class="input-text" id="confirm-pass" minlength="6" placeholder="Confirm password" required="" type="password"/>
</div>
<button class="btn btn-primary btn-lg" id="submit-btn" style="width: 100%; margin-top: 8px;" type="submit">Update Password</button>
</form>
</div>
</main>
<script src="../../js/config.js"></script>
<script src="../../js/firebase-config.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    if (!oobCode) {
      Toast.show({ message: 'Invalid or missing password reset code link.', type: 'error' });
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;

      if (newPass !== confirmPass) {
        Toast.show({ message: 'Passwords do not match.', type: 'error' });
        return;
      }

      if (!oobCode) {
        Toast.show({ message: 'Cannot reset password: reset code is missing.', type: 'error' });
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Updating...';
        await NextGenAuth.confirmPasswordResetCode(oobCode, newPass);
        Toast.show({ message: 'Password updated successfully! Redirecting to login...', type: 'success' });
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        console.error('Password reset code error:', err);
        Toast.show({ message: err.message || 'Password reset failed. Code may have expired.', type: 'error' });
      }
    });
  </script>
</body>
</html>
