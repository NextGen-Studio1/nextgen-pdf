<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
    </div>
  </header>

  <main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
    <div class="card" style="width: min(440px, 100%); padding: 36px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <h2>Set new password</h2>
        <p style="margin-top: 6px;">Please choose a secure new password</p>
      </div>

      <form id="reset-form" onsubmit="event.preventDefault(); Toast.show({ message: 'Password updated successfully!', type: 'success' }); setTimeout(() => window.location.href='login.html', 1500);">
        <div class="form-group">
          <label class="form-label" for="new-pass">New password</label>
          <input type="password" id="new-pass" class="input-text" placeholder="At least 8 characters" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-pass">Confirm new password</label>
          <input type="password" id="confirm-pass" class="input-text" placeholder="Confirm password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">Update Password</button>
      </form>
    </div>
  </main>

  <script src="../../js/components.js"></script>
</body>
</html>
