<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — NextGen PDF</title>
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
    <div class="card" style="width: min(440px, 100%); padding: 36px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <h2>Forgot password?</h2>
        <p style="margin-top: 6px;">Enter your email to receive a password reset link</p>
      </div>

      <form id="forgot-form" onsubmit="event.preventDefault(); Toast.show({ message: 'Reset email sent! Check your inbox.', type: 'success' });">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="input-text" placeholder="name@company.com" required />
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">Send Reset Link</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Remember your password? <a href="login.html" style="color: var(--primary); font-weight: 700;">Back to login</a>
      </div>
    </div>
  </main>

  <script src="../../js/components.js"></script>
</body>
</html>
