<!DOCTYPE html>

<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password — NextGen PDF</title>
<link href="../../Assests/Logo-icon.png" rel="icon" type="image/png"/>
<link href="../../css/style.css" rel="stylesheet"/>
<meta content="NextGen PDF online document and PDF tools." name="description"/><meta content="noindex, nofollow" name="robots"/><link href="https://nextgen-pdf.web.app/pages/auth/forgot-password" rel="canonical"/><meta content="Forgot Password — NextGen PDF" property="og:title"/><meta content="NextGen PDF online document and PDF tools." property="og:description"/><meta content="https://nextgen-pdf.web.app/pages/auth/forgot-password" property="og:url"/><meta content="website" property="og:type"/><meta content="NextGen PDF" property="og:site_name"/><meta content="https://nextgen-pdf.web.app/Assests/Logo-clean.png" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Forgot Password — NextGen PDF" name="twitter:title"/><meta content="NextGen PDF online document and PDF tools." name="twitter:description"/><meta content="https://nextgen-pdf.web.app/Assests/Logo-clean.png" name="twitter:image"/></head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
<!-- Header -->
<header class="site-header">
<div class="container nav-bar">
<a class="brand-logo" href="../../index.html">
<img alt="NextGen PDF" src="../../Assests/Logo-icon.png"/>
<span>NextGen <b class="text-gradient">PDF</b></span>
</a>
<div style="display: flex; align-items: center; gap: 12px;">
<button aria-label="Toggle Theme" class="theme-btn" data-theme-toggle="">🌙</button>
</div>
</div>
</header>
<main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
<div class="card" style="width: min(440px, 100%); padding: 36px;">
<div style="text-align: center; margin-bottom: 28px;">
<h2>Forgot password?</h2>
<p style="margin-top: 6px;">Enter your email to receive a password reset link</p>
</div>
<form id="forgot-form">
<div class="form-group">
<label class="form-label" for="email">Email address</label>
<input class="input-text" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<button class="btn btn-primary btn-lg" id="submit-btn" style="width: 100%; margin-top: 8px;" type="submit">Send Reset Link</button>
</form>
<div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Remember your password? <a href="login.html" style="color: var(--primary); font-weight: 700;">Back to login</a>
</div>
</div>
</main>
<script src="../../js/config.js"></script>
<script src="../../js/firebase-config.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();

      try {
        btn.disabled = true;
        btn.textContent = 'Sending link...';
        await NextGenAuth.sendPasswordReset(email);
        Toast.show({ message: 'Reset email sent! Please check your inbox.', type: 'success', duration: 5000 });
        btn.textContent = 'Link Sent ✓';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        console.error('Password reset error:', err);
        Toast.show({ message: err.message || 'Failed to send reset email.', type: 'error' });
      }
    });
  </script>
</body>
</html>
