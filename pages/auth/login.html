<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — NextGen PDF</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../../Assests/Logo-icon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand-logo">
        <img src="../../Assests/Logo-icon.png" alt="NextGen PDF Logo" width="36" height="36" />
        <span>NextGen <b class="text-gradient">PDF</b></span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="theme-btn" data-theme-toggle aria-label="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main style="flex: 1; display: grid; place-items: center; padding: 40px 16px;">
    <div class="card" style="width: min(440px, 100%); padding: 36px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <h2>Welcome back</h2>
        <p style="margin-top: 6px;">Sign in to your NextGen PDF account</p>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); window.location.href='../dashboard/index.html';">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="input-text" placeholder="name@company.com" required />
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Password</span>
            <a href="forgot-password.html" style="color: var(--primary); font-size: 12px;">Forgot password?</a>
          </div>
          <input type="password" id="password" class="input-text" placeholder="••••••••" required />
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center;">
          <label class="checkbox-label">
            <input type="checkbox" checked /> Remember me for 30 days
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">Sign In</button>
      </form>

      <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-muted); font-size: 13px;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span>OR</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <button type="button" class="btn btn-secondary btn-lg" style="width: 100%; justify-content: center;" onclick="Toast.show({ message: 'Google Auth Ready', type: 'info' })">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px; height: 18px;" />
        Continue with Google
      </button>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create account</a>
      </div>
    </div>
  </main>

  <script src="../../js/components.js"></script>
</body>
</html>
